spring.application.name=ms-tickets
spring.profiles.default=local
server.port=${SERVER_PORT:8085}
jwt.secret=${JWT_SECRET:change-me-jwt-secret-min-32-chars}
app.security.docs-public=${APP_SECURITY_DOCS_PUBLIC:true}
logging.pattern.level=%5p [requestId=%X{requestId:-na}]

# RabbitMQ Exchange, Queue y Routing Key
rabbitmq.exchange.name=tickets.exchange
rabbitmq.queue.name=tickets.queue
rabbitmq.routing.key=tickets.routing.key

# ===============================
# ACTUATOR CONFIGURATION
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===============================
# SWAGGER / OPENAPI CONFIGURATION
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
