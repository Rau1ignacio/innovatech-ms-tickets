spring.datasource.url=jdbc:mysql://${DB_HOST:${TICKETS_MYSQL_HOST:localhost}}:${DB_PORT:${TICKETS_MYSQL_PORT:3306}}/${DB_NAME:${TICKETS_MYSQL_DATABASE:innovatech_tickets}}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:${TICKETS_MYSQL_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${TICKETS_MYSQL_PASSWORD:change_me_local_tickets}}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:rabbit_local_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbit_local_password}

spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
